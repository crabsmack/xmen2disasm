# Phase 3 compiler candidates (criterion C1; docs/phases/P3-compiler.md, docs/COMPILER.md).
# Toolchains live outside the repo under $XMEN2_TOOLCHAINS (default ..\xmen2-toolchains),
# one folder per candidate `root`; $XMEN2_TOOLCHAINS/SOURCES.md records where each came from.
# Never commit them.
#
#   status      obtained | unavailable (unavailable says what was searched)
#   root        folder under $XMEN2_TOOLCHAINS
#   compiler    MPW tool under root, run headless with mps (tools/cc.py); absent = libraries only
#                 (THINK C, Symantec C++ and CodeWarrior compilers are GUI IDEs, not MPW tools)
#   libs        library globs under root (MacBinary .bin as downloaded: data fork read for mpw)
#   lib_format  mpw (MPW .o, parsed by tools/mpwobj.py) | raw (byte search; formats we don't parse)
#   cvers       the CVers= string the compiler writes into its objects

# --- MPW C (Apple) -------------------------------------------------------------------------

[[candidate]]
id = "mpw-c-3.1"
family = "mpw-c"
version = "MPW C 3.1 (MPW 3.1, 1990)"
status = "obtained"
source = "discmaster.textfiles.com: 'ETO Development Tools 4.iso' /Tools - Objects/Macintosh Programmer’s Workshop/MPW 3.1/MPW"
root = "mpw-c-3.1"
compiler = "Tools/C"
libs = ["raw/Libraries/**/*.o.bin"]
lib_format = "mpw"
mismatch = "BanimazaDoor_PushCallback ($039D24) compiles to 0xC2 bytes with 177 differing (sp-relative arguments, other register use): code generator predates the ROM's"

